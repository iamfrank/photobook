[package]
name = "photobook"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Generate editable Typst photobooks and saddle-stitch PDFs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp"] }
natord = "1"
serde_json = "1"
tempfile = "3"
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "datetime", "emit-diagnostics"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"

[dev-dependencies]
typst-render = "=0.15.1"

# Keep embedded-compiler debug builds manageable.
[profile.dev]
debug = 0

[profile.test]
debug = 0
